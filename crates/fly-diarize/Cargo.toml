[package]
name = "fly-diarize"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fly-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio.workspace = true
# VBx refinement: in-process fbank + ONNX speaker embeddings over the same
# pinned model file the sherpa sidecar uses, then Bayesian-HMM clustering.
rustfft = "6"
hound.workspace = true

# Windows and Apple-Silicon macOS statically link ort's prebuilt onnxruntime.
# Linux must not (the prebuilts need glibc ≥ 2.38; releases build on
# ubuntu-22.04 = glibc 2.35 on purpose, the users' distro floor) and Intel
# macOS cannot (ort publishes no x86_64-apple-darwin prebuilt at all): both
# build ort in load-dynamic mode, which links nothing. Linux dlopens the
# libonnxruntime.so shipped inside the sherpa sidecar bundle at runtime
# (sherpa.rs::ensure_ort_dylib); Intel macOS never constructs the in-process
# refiner in the first place (pipeline keeps the measured agglomerative
# operating point there — docs/BENCHMARKS.md Phase 2a).
[target.'cfg(not(any(target_os = "linux", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
ort = "2.0.0-rc.13"

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["load-dynamic"] }
