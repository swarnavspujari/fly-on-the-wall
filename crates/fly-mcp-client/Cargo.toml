[package]
name = "fly-mcp-client"
version.workspace = true
edition.workspace = true
license.workspace = true

# Connectors beta (spec §4.3): FOTW's own Ask agent calls tools on MCP servers
# the user connects. Built on the official `rmcp` SDK, pinned exactly so an
# SDK update is always a reviewed change. Only the client half of rmcp is
# compiled: no server, no macros, no sampling or roots.
#
# The server crate (`fly-mcp`, the `flyonthewall-mcp` binary) is separate and
# doesn't depend on this one.

[features]
# Test-only helpers: the malicious fixture server and a network policy that
# allows plain http to 127.0.0.1. Never enabled by the app.
test-support = ["tokio/io-std"]

[dependencies]
fly-llm.workspace = true
fly-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["net"] }
reqwest.workspace = true
sha2.workspace = true
chrono.workspace = true
uuid.workspace = true
url = "2"
http = "1"
rmcp = { version = "=3.8.0", default-features = false, features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
    "auth",
    "reqwest",
] }

[dev-dependencies]
fly-mcp-client = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["net", "io-util"] }

[[bin]]
# The malicious fixture MCP server (stdio), for tests and the real-app check.
# Built only with `--features test-support`; never bundled.
name = "fly-mcp-fixture"
path = "src/bin/fixture.rs"
required-features = ["test-support"]
