  { question = "What's going on with Felix?", answer = "Brightpath offered Felix a role running their support team [seg:m10-03], and you plan a retention bonus of fifteen thousand [seg:m10-07].", citations = ["m10-03", "m10-07"], on_device = true },
]
script = "guard_follow_up"
provider = "cloud"
tier = "S"
kind = "guard"

[[scenario]]
