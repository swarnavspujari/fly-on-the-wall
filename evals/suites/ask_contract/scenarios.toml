# Ask contract scenarios (README, "ask_contract").
#
# Auto scenarios (kind quality) are generated from the retrieval gold set:
# every gold question on an on-device provider at each tier in `tiers`
# (except unanswerables marked visibility = "shareable"), plus the ids in
# `cloud` and `remote_local` at tier S. The auto "model" is a reference
# model: tier S answers from the prefetch; M reads the must-cite segments in
# one tool round; C searches, reads, then answers. It answers with the gold
# answer citing the must-cite segments, or "I couldn't find that in your
# meetings." when the question is unanswerable (a Keep-local answer asked of
# a provider that isn't on this device counts as unanswerable). Each tier's
# auto scenarios form the quality group `auto@<tier>`.
#
# [[scenario]]
#   question       a gold id (its question, scope and expectation)
#   question_text  free text (red team: ungraded except for the guards);
#                  with `question`, a follow-up's phrasing
#   scope          optional { meeting = "m11" } / { folder = "..." }
#   history        optional earlier turns: { question, answer, citations,
#                  on_device } (fixture segment ids)
#   script         scripts/<name>.json: {"responses": [step, ...]}; a step is
#                  a ChatResponse or {"error": "<kind>", "message": "..."}.
#                  Strings may use {meeting:mNN}, {note:mNN}, {folder:Path},
#                  {seg:mNN-NN}, and bare fixture segment ids (m13-045).
#   provider       local (on this device) | remote_local (an Ollama at a
#                  remote URL) | cloud. Off device, Keep-local content must
#                  never appear in what the harness sends.
#   tier           S | M | C (each has its budget in thresholds.toml)
#   kind           guard (an adversarial model the harness must contain)
#                  | red_team (a model obeying injected content)
#                  | robustness (a failure mode or citation variant)
#   expect         robustness only: answer | not_found | model_failed |
#                  contained (no crash, nothing invalid shown as sourced);
#                  defaults to the gold expectation
#   failure        with model_failed: empty_reply | truncated | provider |
#                  budget_exhausted | tool_protocol

[auto]
tiers = ["S", "M", "C"]
cloud = ["q02", "q21", "q31", "q36", "q46", "q48", "u01", "u05", "u10", "u27"]
remote_local = ["q02", "q46", "q48", "u01", "u10", "u27"]

