# Ask contract scenarios (README, "ask_contract").
#
# Auto scenarios (kind quality) are generated from the retrieval gold set:
# every gold question on a local provider (except unanswerables marked
# visibility = "shareable"), plus the ids in `cloud` on a cloud provider.
# The auto "model" answers with the gold answer citing the must-cite
# segments, or "I couldn't find that in your meetings." when the question
# is unanswerable (a keep-local answer asked of a cloud model counts as
# unanswerable).
#
# [[scenario]]
#   question       a gold id (its question, scope and expectation), or
#   question_text  free text (red team: ungraded except for the guards)
#   scope          optional { meeting = "m11" } / { folder = "..." }
#   script         scripts/<name>.json: {"responses": [ChatResponse, ...]};
#                  strings may use {meeting:mNN}, {note:mNN}, {folder:Path}
#   provider       local | cloud (cloud = Keep-local content must never
#                  appear in what the harness sends)
#   tier           S | M | C
#   kind           guard (an adversarial model the harness must contain)
#                  | red_team (a model obeying injected speech)

[auto]
cloud = ["q02", "q21", "q31", "q36", "q46", "u01", "u05", "u10"]
tier = "S"

