# Retrieval gold set (spec §4.2 eval 1, §4.2a #1 and #14). Written before
# the first run; questions are phrased the way a user would type them, not
# tuned to the retriever.
#
# [[answerable]]
#   id          stable id (also used by ask_contract scenarios)
#   question    the text passed to search_passages as `query`
#   must_cite   segments a complete answer needs. Each entry is one segment
#               id, or a list of alternative ids (any one satisfies it).
#   evidence    words the must-cite segments contain (checked against the
#               fixture text, case-insensitive), so a wrong id fails loudly
#   answer      the gold answer in plain words (the `auto` script's reply)
#   category    reported breakdowns
#   scope       optional: { meeting = "m05" } or { folder = "Customers/Harrowgate" }
#   keep_local  optional: true when the answer lives only in the keep-local
#               meeting (answerable under Visibility::All only)
#
# [[unanswerable]]
#   id, question, why (what the corpus does and doesn't say), and optional
#   visibility = "shareable" when only the shareable view must find nothing.

