version: 2

# Keeps the SHA-pinned actions and the lockfile-pinned npm / cargo trees
# current. Minor + patch bumps are grouped into one PR per ecosystem;
# majors still arrive as individual PRs so they get individual review.
#
# cooldown: a release must be 5 days old before Dependabot proposes it, so a
# compromised or broken publish is usually yanked before it reaches a PR.
# Security updates ignore the cooldown.
updates:
  # Actions change rarely and every bump is a SHA to review: monthly.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-root-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-frontend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
