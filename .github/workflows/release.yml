name: Release

# Builds installers for Windows (NSIS), macOS (.app/.dmg, both architectures)
# and Linux (AppImage + .deb) on every version tag and attaches them to a
# GitHub Release.
#
# macOS bundles are Developer ID-signed and notarized when the APPLE_*
# secrets are set (Tauri imports the cert into a temp keychain, codesigns
# with hardened runtime + src-tauri/Entitlements.plist, and submits to
# notarytool). Windows installers remain unsigned — see README "Install
# Fly on the Wall" for the SmartScreen notes shipped to users.
#
# Every leg additionally feeds the in-app auto-updater: it signs its updater
# artifact with the Tauri updater key (TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]
# repo secrets) — NSIS installer on Windows, .app.tar.gz on macOS, AppImage on
# Linux — and uploads a per-platform manifest fragment. The updater-manifest
# job then merges all four into latest.json, which installed apps poll via
# .../releases/latest/download/latest.json. (Linux deb installs are apt's job;
# only the AppImage self-updates.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Updater artifacts (.sig) are opt-in via the tauri.updater.conf.json
          # overlay so plain local `npx tauri build` keeps working without the
          # signing key. updaterPlatform/updaterAsset/updaterSig drive the
          # per-leg manifest fragment merged into latest.json by the
          # updater-manifest job (updaterAsset globs the RENAMED name in
          # dist-upload/; updaterSig globs the original bundle dir).
          - name: windows-x64
            os: windows-latest
            buildArgs: --config src-tauri/tauri.updater.conf.json
            bundles: |
              target/release/bundle/nsis/*.exe
            updaterPlatform: windows-x86_64
            updaterAsset: "*-setup-windows-x64.exe"
            updaterSig: target/release/bundle/nsis/*-setup.exe.sig
          # The matrix name doubles as the asset-name suffix (see "Rename
          # artifacts"), so spell out which Mac each dmg is for — download
          # pages show "apple-silicon" / "intel", not cpu arch jargon.
          - name: macos-apple-silicon
            os: macos-latest
            buildArgs: --config src-tauri/tauri.updater.conf.json
            bundles: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app.tar.gz
            updaterPlatform: darwin-aarch64
            updaterAsset: "*-macos-apple-silicon.tar.gz"
            updaterSig: target/release/bundle/macos/*.app.tar.gz.sig
          - name: macos-intel
            # macos-13 was retired in Dec 2025 (the v0.2.0 run queued 24 h and
            # was cancelled); macos-15-intel is GitHub's supported Intel runner.
            os: macos-15-intel
            buildArgs: --config src-tauri/tauri.updater.conf.json
            bundles: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app.tar.gz
            updaterPlatform: darwin-x86_64
            updaterAsset: "*-macos-intel.tar.gz"
            updaterSig: target/release/bundle/macos/*.app.tar.gz.sig
          - name: linux-x64
            os: ubuntu-22.04
            buildArgs: --config src-tauri/tauri.updater.conf.json
            bundles: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
            updaterPlatform: linux-x86_64
            updaterAsset: "*-linux-x64.AppImage"
            updaterSig: target/release/bundle/appimage/*.AppImage.sig
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libpulse-dev \
            libssl-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # The lockfiles were generated on Windows and npm's optional-deps bug
      # (npm/cli#4828) leaves other platforms' native bindings out of them —
      # even npm install trusts the broken tree. Resolve fresh on this OS.
      - name: Install JS dependencies (fresh resolve — npm/cli#4828)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rm -f package-lock.json frontend/package-lock.json
          npm install --no-audit --no-fund
          npm --prefix frontend install --no-audit --no-fund

      - name: Install JS dependencies
        if: runner.os == 'Windows'
        run: |
          npm ci
          npm --prefix frontend ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Fail in seconds, not after a 20-minute compile: every leg signs updater
      # artifacts now, and a tag that disagrees with the app version would
      # ship a latest.json that installed apps re-download forever.
      - name: Updater preflight
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set — required to sign updater artifacts (see README 'Cutting a release')."
            exit 1
          fi
          cfg_ver=$(jq -r .version src-tauri/tauri.conf.json)
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ "$cfg_ver" != "$tag_ver" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${cfg_ver} — bump the version before tagging."
            exit 1
          fi

      # Same fail-fast idea for macOS: a missing Apple secret would otherwise
      # surface only after the full compile, as an unsigned (or un-notarized)
      # dmg that Gatekeeper calls "damaged" on users' machines.
      - name: Apple signing preflight
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Apple signing secrets:$missing — required to sign + notarize macOS bundles (see README 'Cutting a release')."
            exit 1
          fi
          # Prove the certificate actually imports before the ~15-minute
          # compile. macOS `security` cannot read a .p12 exported with
          # OpenSSL 3.x defaults (PBES2 / AES-256-CBC) and misreports it as
          # "MAC verification failed during PKCS12 import (wrong password?)"
          # even when the password is right — v1.7.0 shipped without mac
          # installers because of exactly that.
          p12="$RUNNER_TEMP/preflight-cert.p12"
          kc="$RUNNER_TEMP/preflight.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p preflight-only "$kc"
          if ! security import "$p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign; then
            echo "::error::APPLE_CERTIFICATE failed to import: APPLE_CERTIFICATE_PASSWORD is wrong, or the .p12 uses OpenSSL 3 default encryption that macOS cannot read — re-export it with 'openssl pkcs12 -export -legacy' (or '-certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1'), see README 'Cutting a release'."
            security delete-keychain "$kc"
            exit 1
          fi
          security delete-keychain "$kc"
          rm -f "$p12"

      # tauri build runs beforeBuildCommand (frontend build + prepare-sidecars).
      # buildArgs layers in createUpdaterArtifacts on every leg, which signs
      # the updater artifact into a detached .sig using the env vars below.
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + notarization (Tauri picks these up
          # automatically; harmless no-ops on the other runners).
          # APPLE_CERTIFICATE is the base64 of the Developer ID Application .p12.
          # APPLE_PASSWORD is an app-specific password from account.apple.com.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Bundled calendar OAuth defaults, read at compile time by
          # src-tauri/src/calendar_defaults.rs (option_env!). These let invited
          # testers connect in one click; if the secrets are unset, the build is
          # simply BYO-only. The Google secret is a non-confidential PKCE
          # desktop-client secret (safe to ship in the binary, kept out of git).
          FOTW_GOOGLE_CLIENT_ID: ${{ secrets.FOTW_GOOGLE_CLIENT_ID }}
          FOTW_GOOGLE_CLIENT_SECRET: ${{ secrets.FOTW_GOOGLE_CLIENT_SECRET }}
          FOTW_MS_CLIENT_ID: ${{ secrets.FOTW_MS_CLIENT_ID }}
        run: npx tauri build ${{ matrix.buildArgs }}

      - name: Rename artifacts with target suffix
        shell: bash
        run: |
          mkdir -p dist-upload
          shopt -s nullglob
          while IFS= read -r pat; do
            [ -z "$pat" ] && continue
            for f in $pat; do
              base=$(basename "$f")
              # .app.tar.gz must keep its compound extension — a suffix spliced
              # before ".gz" alone would break the name latest.json points at.
              case "$base" in
                *.tar.gz) stem="${base%.tar.gz}"; ext="tar.gz";;
                *) stem="${base%.*}"; ext="${base##*.}";;
              esac
              # GitHub replaces spaces in release-asset names with dots on upload,
              # so pre-apply that here: the on-disk name then equals the served
              # asset name equals the url latest.json is built from. A spaced url
              # 404s the updater ("Download request failed with status 404").
              out="${stem}-${{ matrix.name }}.${ext}"
              out="${out// /.}"
              cp "$f" "dist-upload/${out}"
            done
          done <<< "${{ matrix.bundles }}"
          ls -la dist-upload/

      # One platform entry of latest.json: signature is the detached .sig of
      # the (byte-identical, pre-rename) updater artifact; url points at the
      # renamed release asset. The updater-manifest job merges all legs.
      - name: Generate updater manifest fragment
        shell: bash
        run: |
          asset=(dist-upload/${{ matrix.updaterAsset }})
          sig=(${{ matrix.updaterSig }})
          [ -f "${asset[0]}" ] || { echo "::error::renamed updater asset (${{ matrix.updaterAsset }}) not found in dist-upload/"; exit 1; }
          [ -f "${sig[0]}" ] || { echo "::error::updater .sig not found — did createUpdaterArtifacts run?"; exit 1; }
          mkdir -p updater-fragment
          jq -n \
            --arg platform "${{ matrix.updaterPlatform }}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "${asset[0]}")" \
            --arg signature "$(cat "${sig[0]}")" \
            '{platforms: {($platform): {signature: $signature, url: $url}}}' \
            > "updater-fragment/${{ matrix.name }}.json"
          cat "updater-fragment/${{ matrix.name }}.json"

      - name: Upload updater fragment
        uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-${{ matrix.name }}
          path: updater-fragment/*.json
          retention-days: 1

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist-upload/*
          fail_on_unmatched_files: true

  # latest.json can only exist once ALL legs signed their artifact — installed
  # apps poll .../releases/latest/download/latest.json, so publishing a partial
  # manifest would silently strand every platform missing from it. If a leg
  # fails, this job is skipped and the release ships without auto-update;
  # re-run the failed leg to publish the manifest.
  updater-manifest:
    name: Publish updater manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download updater fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-fragment-*
          merge-multiple: true
          path: fragments

      - name: Merge latest.json
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          count=$(ls fragments/*.json | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 updater fragments, found $count — refusing to publish a partial latest.json"
            exit 1
          fi
          jq -s \
            --arg version "$version" \
            --arg notes "Fly on the Wall ${version} — full notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: (map(.platforms) | add)}' \
            fragments/*.json > latest.json
          cat latest.json

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: latest.json
          fail_on_unmatched_files: true
