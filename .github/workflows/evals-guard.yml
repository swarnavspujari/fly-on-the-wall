name: Evals lock

# The CI half of the eval lock (evals/README.md, "How it's enforced").
# Evals are immutable to AI coding agents; only the user changes them.
#
# `pull_request_target` runs THIS file as it is on the base branch (main),
# so a pull request can't change the check that judges it. The job hashes
# the protected paths at the PR head and compares the hash with the
# repository variable EVALS_LOCK_SHA256, which only the user sets:
#
#   evals/**   .github/workflows/evals.yml   .github/workflows/evals-guard.yml
#   .claude/settings.json   .claude/hooks/**
#
# The hash is the SHA-256 of `git -c core.quotePath=true ls-tree -r` over
# those paths (mode, type, blob id, path), sorted: blob ids make it
# independent of line endings. evals/lock-hash.sh computes the same value.
# On push to main it checks main itself, so drift there shows up too.
#
# It also fails when any other workflow at the PR head defines a job with
# one of the eval check names (evals-lock, evals-security, evals-quality),
# which could otherwise satisfy a required check with a different job.
#
# It never executes PR code. The PR head is checked out only so its git
# objects can be read with `git ls-tree`, `git grep` and `git diff
# --name-only`; nothing from it is built, sourced or run, credentials aren't
# persisted, and the token is read-only. The only PR-derived values used are
# commit SHAs, passed through env.
#
# Fails when the hash differs from the variable, or the variable is unset.
# The computed hash is always printed to the job summary so the user can
# copy it after reviewing an eval change. Job name: evals-lock.
on:
  # zizmor: ignore[dangerous-triggers] -- read-only lock check: it hashes the PR head's protected paths with git ls-tree and never builds or runs PR code (see the header).
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: evals-lock-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  evals-lock:
    name: evals-lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Compare the lock hash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXPECTED: ${{ vars.EVALS_LOCK_SHA256 }}
        run: |
          set -euo pipefail
          paths=(evals .github/workflows/evals.yml .github/workflows/evals-guard.yml .claude/settings.json .claude/hooks)
          hash=$(git -c core.quotePath=true ls-tree -r --full-tree "$HEAD_SHA" -- "${paths[@]}" | LC_ALL=C sort | sha256sum | cut -d' ' -f1)
          expected=$(printf '%s' "$EXPECTED" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          echo "Lock hash at $HEAD_SHA: $hash"

          # Which protected files change (diagnostics only; the base
          # commit's objects are fetched anonymously, the repo is public).
          changed=""
          if [ -n "$BASE_SHA" ] && ! [[ "$BASE_SHA" =~ ^0*$ ]] &&
            git fetch --quiet --depth=1 --no-tags origin "$BASE_SHA" 2>/dev/null; then
            changed=$(git -c core.quotePath=true diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "${paths[@]}" || true)
          fi

          # Another workflow must not impersonate an eval check. A tripwire,
          # not a proof (GitHub matches required checks by name, and
          # expressions can't be fully evaluated here): the literal names
          # anywhere, plus each parsed job's id and name, with the string
          # pieces inside expressions joined, and its matrix values.
          impostors=$(git grep -nE 'evals-(lock|security|quality)\b|evals-\$\{\{' "$HEAD_SHA" -- \
            '.github/workflows/*.yml' '.github/workflows/*.yaml' \
            ':!.github/workflows/evals.yml' ':!.github/workflows/evals-guard.yml' || true)
          parsed=$(python3 - <<'PY'
          import glob, os, re, sys
          try:
              import yaml
          except ImportError:
              print("PyYAML is missing on the runner, so job names couldn't be parsed")
              sys.exit(0)
          LOCKED = {".github/workflows/evals.yml", ".github/workflows/evals-guard.yml"}
          NAMES = ("evals-lock", "evals-security", "evals-quality")

          def strings(x):
              if isinstance(x, str):
                  yield x
              elif isinstance(x, dict):
                  for k, v in x.items():
                      yield from strings(k)
                      yield from strings(v)
              elif isinstance(x, list):
                  for v in x:
                      yield from strings(v)

          def suspicious(text, matrix):
              t = text.lower()
              literals = "".join(re.findall(r"'([^']*)'", t))
              bare = re.sub(r"\$\{\{.*?\}\}", "", t)
              if any(n in s for n in NAMES for s in (t, literals, bare, bare + literals)):
                  return True
              # An expression name next to anything spelling "eval".
              # ("$" + "{{": a literal one here would be an Actions expression.)
              return ("$" + "{{") in t and "eval" in (t + literals + matrix)

          for path in sorted(glob.glob(".github/workflows/*.y*ml")):
              rel = path.replace(os.sep, "/")
              if rel in LOCKED:
                  continue
              try:
                  wf = yaml.safe_load(open(path, encoding="utf-8")) or {}
              except Exception as e:
                  print(f"{rel}: not parseable ({e})")
                  continue
              jobs = wf.get("jobs") if isinstance(wf, dict) else None
              for jid, job in (jobs or {}).items() if isinstance(jobs, dict) else []:
                  job = job if isinstance(job, dict) else {}
                  name = str(job.get("name", jid))
                  matrix = "".join(strings((job.get("strategy") or {}).get("matrix"))).lower()
                  if suspicious(str(jid), matrix) or suspicious(name, matrix):
                      print(f"{rel}: job {jid} (name: {name})")
          PY
          )
          impostors=$(printf '%s\n%s' "$impostors" "$parsed" | sed '/^$/d')

          {
            echo "### Eval lock"
            echo
            echo "Lock hash at \`$HEAD_SHA\`:"
            echo
            echo '```'
            echo "$hash"
            echo '```'
            if [ -n "$changed" ]; then
              echo
              echo "Protected files changed against \`$BASE_SHA\`:"
              echo
              echo '```'
              echo "$changed"
              echo '```'
            fi
            if [ -n "$impostors" ]; then
              echo
              echo "Other workflows naming an eval check:"
              echo
              echo '```'
              echo "$impostors"
              echo '```'
            fi
            echo
            echo "Only the user changes evals (evals/README.md, \"Changing an eval\"). To accept this version, set the repository variable \`EVALS_LOCK_SHA256\` to the hash above (Settings → Secrets and variables → Actions → Variables) and re-run this job."
          } >>"$GITHUB_STEP_SUMMARY"

          if [ -n "$impostors" ]; then
            echo "::error title=Eval lock::Another workflow names an eval check (evals-lock, evals-security or evals-quality); only the locked eval workflows may."
            exit 1
          fi
          if [ -z "$expected" ]; then
            echo "::error title=Eval lock::EVALS_LOCK_SHA256 is not set. The user sets it to the hash in this job's summary."
            exit 1
          fi
          if [ "$hash" != "$expected" ]; then
            echo "::error title=Eval lock::The protected eval files differ from the locked version (expected $expected, got $hash). Only the user changes evals; see this job's summary."
            exit 1
          fi
          echo "Eval lock matches."
