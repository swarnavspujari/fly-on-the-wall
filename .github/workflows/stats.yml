name: Download stats

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # "Commit snapshot" pushes docs/data back to main
    steps:
      # Credentials stay persisted ON PURPOSE: the final step's plain
      # `git push` authenticates with the checkout-stored GITHUB_TOKEN. No
      # third-party dependencies run in this job (collect-stats.mjs uses only
      # node: built-ins).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Collect release + traffic stats
        env:
          # STATS_TOKEN (fine-grained PAT, Administration: read) unlocks the
          # traffic API; without it the run still works, minus traffic numbers.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-stats.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(stats): daily download snapshot [skip ci]"
          git push
