name: Download stats

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats
  cancel-in-progress: false

# The snapshot is committed to the `stats` branch, not main: main requires
# the `ci-ok` check, and a personal-account repo can't exempt the Actions bot
# from that rule. The landing page and README badge read the files from the
# branch via raw.githubusercontent.com.
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # "Commit snapshot" pushes to the `stats` branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Credentials stay persisted in THIS checkout on purpose: the final
      # step's plain `git push` authenticates with the stored GITHUB_TOKEN. No
      # third-party dependencies run in this job (collect-stats.mjs uses only
      # node: built-ins) and nothing is uploaded as an artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 # zizmor: ignore[artipacked]
        with:
          ref: stats
          path: stats-data
      - name: Collect release + traffic stats
        env:
          # STATS_TOKEN (fine-grained PAT, Administration: read) unlocks the
          # traffic API; without it the run still works, minus traffic numbers.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-stats.mjs stats-data
      - name: Commit snapshot
        working-directory: stats-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json downloads-badge.json stats-history.jsonl
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(stats): daily download snapshot"
          git push
