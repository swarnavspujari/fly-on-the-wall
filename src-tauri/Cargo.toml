[package]
name = "fly-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# lib + thin main so the same code can back desktop now and mobile later
[lib]
name = "fly_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: stream local recordings into the editor's audio player.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
fly-core.workspace = true
fly-audio.workspace = true
fly-asr.workspace = true
fly-diarize.workspace = true
fly-llm.workspace = true
fly-calendar.workspace = true
fly-capture-screen.workspace = true
fly-storage.workspace = true
fly-secrets.workspace = true
fly-ask.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
sha2.workspace = true
zip.workspace = true
tar.workspace = true
bzip2.workspace = true
flate2.workspace = true
xz2.workspace = true
hex = "0.4"
sysinfo = "0.39"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs.workspace = true
tauri-plugin-clipboard-manager = "2"

# Auto-update + relaunch + single-instance are desktop-only plugins; keep them
# out of a future mobile build of this lib.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# The cloud-AI consent dialog (llm_commands.rs request_cloud_consent) talks to
# rfd directly. Its safe answer is the default (first) button, and the dialog
# plugin's builder would turn Esc / closing into a click on the second one,
# which is allow. Same version, features and targets tauri-plugin-dialog
# already builds, so no new crate.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6", "gtk3"] }

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
# ask_live.rs (ignored): runs the harness on the evals' fixture corpus and
# records replays with their RecordingProvider. Tests only.
fly-evals = { path = "../evals/runner" }
